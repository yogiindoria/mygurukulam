<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yogesh Indoria</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    background-size: 400% 400%;
    animation: gradientMove 10s ease infinite;
  }

  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .card {
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 20px;
    padding: 50px 60px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    color: #fff;
    max-width: 90%;
  }

  .emoji {
    font-size: 60px;
    margin-bottom: 10px;
  }

  h1 {
    font-size: 2.6rem;
    margin-bottom: 10px;
    letter-spacing: 1px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
  }

  .role {
    font-size: 1.3rem;
    margin-bottom: 8px;
    color: #ffe9a8;
  }

  .gurukulam {
    font-size: 1.1rem;
    color: #d4f1f4;
    margin-bottom: 20px;
  }

  .badges {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 20px;
  }

  .badge {
    background: rgba(255,255,255,0.2);
    padding: 8px 16px;
    border-radius: 30px;
    font-size: 1.2rem;
  }

  footer {
    margin-top: 25px;
    font-size: 0.9rem;
    opacity: 0.8;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="emoji">🚀👨‍💻</div>
    <h1>Yogesh Indoria</h1>
    <div class="role">⚙️ Learning DevOps</div>
    <div class="gurukulam">🎓 from My Gurukulam</div>

    <div class="badges">
      <span class="badge">🐳 Docker</span>
      <span class="badge">☸️ Kubernetes</span>
      <span class="badge">🔧 Nginx</span>
      <span class="badge">☁️ Cloud</span>
    </div>

    <footer>✨ Hosted on Nginx Server ✨</footer>
  </div>

</body>
</html>

apiVersion: v1
kind: Pod
metadata:
  name: es-test
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:latest
      command:
        - sh
        - -c
        - |
          curl -sS -u "elastic:${ELASTIC_PASSWORD}" \
            http://elasticsearch:9200/_cluster/health?pretty
      env:
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elasticsearch-secret
              key: elastic-password
